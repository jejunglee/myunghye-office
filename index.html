/* ---------- 인쇄(A4 세로) · 엑셀 저장 ---------- */
function schoolYear(d) { return d.getMonth() + 1 >= 3 ? d.getFullYear() : d.getFullYear() - 1; }
function planInfo(type, from, to) {
  const f = parseYmd(from);
  if (type === 'week') {
    const ws = mondayOf(f);
    return { kind: '주중업무계획', title: `${schoolYear(ws)}학년도 ${ws.getMonth() + 1}월 ${weekOfMonth(ws)}주 주중업무계획`, period: `${fmtMD(ymd(ws))} ~ ${fmtMD(ymd(addDays(ws, 4)))}` };
  }
  return { kind: '월중행사계획', title: `${schoolYear(f)}학년도 ${f.getMonth() + 1}월 월중행사계획`, period: `${f.getFullYear()}. ${f.getMonth() + 1}. 1. ~ ${f.getMonth() + 1}. ${parseYmd(to).getDate()}.` };
}
function planOutputEvents(type, from, to, scope) {
  let list = eventsBetween(from, to);
  if (type === 'month' && scope !== 'all') list = list.filter((e) => e.kind === '월중행사' || e.important);
  return list;
}
function planDays(type, from, to, list, allDays) {
  const days = []; const has = new Set(list.map((e) => e.date));
  for (let d = parseYmd(from); ymd(d) <= to; d = addDays(d, 1)) {
    const ds = ymd(d); const wkend = d.getDay() === 0 || d.getDay() === 6;
    if (type === 'week' ? (!wkend || has.has(ds)) : (allDays || has.has(ds))) days.push(ds);
  }
  return days;
}
const evTime = (e) => (e.start ? e.start + (e.end ? '~' + e.end : '') : '');

function printHeader(info, opt) {
  const sign = opt.sign ? `<table class="pr-sign"><tr><th rowspan="2">결<br>재</th><th>담당</th><th>부장</th><th>교감</th><th>교장</th></tr><tr><td></td><td></td><td></td><td></td></tr></table>` : '';
  return `<div class="pr-head${opt.sign ? ' has-sign' : ''}"><div class="pr-title">${esc(info.title)}</div>${sign}</div>
    <div class="pr-sub"><span>기간: ${esc(info.period)}</span><span>${SCHOOL} · 작성 ${esc(dept(ME.dept).name)} ${esc(ME.name)} · ${fmtKo(today()).replace(/ .요일$/, '')}</span></div>`;
}
function printListHtml(type, from, to, list, opt) {
  const days = planDays(type, from, to, list, opt.allDays);
  const rows = days.map((ds) => {
    const d = parseYmd(ds); const evs = list.filter((e) => e.date === ds);
    const cls = d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : '';
    const dateCells = (n) => `<td class="c ${cls}" rowspan="${n}">${d.getMonth() + 1}.${d.getDate()}</td><td class="c ${cls}" rowspan="${n}">${DOW[d.getDay()]}</td>`;
    if (!evs.length) return `<tr class="${cls}">${dateCells(1)}<td></td><td></td><td></td><td></td></tr>`;
    return evs.map((e, i) => `<tr class="${cls}">${i === 0 ? dateCells(evs.length) : ''}<td class="c">${esc(evTime(e))}</td><td>${e.important ? '★ ' : ''}${esc(e.title)}</td><td>${esc(e.place || '')}</td><td class="c">${esc(dept(e.dept).name)}</td></tr>`).join('');
  }).join('');
  return `${printHeader(planInfo(type, from, to), opt)}
    <table class="pr-table"><colgroup><col style="width:12mm"><col style="width:9mm"><col style="width:21mm"><col><col style="width:25mm"><col style="width:26mm"></colgroup>
    <thead><tr><th>날짜</th><th>요일</th><th>시간</th><th>${type === 'week' ? '업무 내용' : '행사 내용'}</th><th>장소</th><th>담당</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" class="c">등록된 일정이 없습니다.</td></tr>'}</tbody></table>`;
}
function printCalendarHtml(from, to, list, opt) {
  const first = parseYmd(from); const start = addDays(first, -first.getDay());
  const weeks = [];
  for (let w = 0; w < 6; w++) {
    const wk = []; for (let i = 0; i < 7; i++) wk.push(addDays(start, w * 7 + i));
    if (w > 0 && wk[0].getMonth() !== first.getMonth()) break;
    weeks.push(wk);
  }
  const h = Math.floor(225 / weeks.length);
  return `${printHeader(planInfo('month', from, to), opt)}
    <table class="pr-table pr-cal"><thead><tr>${DOW.map((d, i) => `<th class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</th>`).join('')}</tr></thead>
    <tbody>${weeks.map((wk) => `<tr>${wk.map((d) => {
      const ds = ymd(d); const other = d.getMonth() !== first.getMonth();
      const evs = other ? [] : list.filter((e) => e.date === ds);
      return `<td style="height:${h}mm" class="${other ? 'other' : ''} ${d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : ''}"><div class="pr-day">${d.getDate()}</div>${evs.map((e) => `<div class="pr-ev">${e.important ? '★' : '·'} ${e.start ? `<b>${esc(e.start)}</b> ` : ''}${esc(e.title)}</div>`).join('')}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table>`;
}
function doPrint(html) {
  let el = $('#printArea');
  if (!el) { el = document.createElement('div'); el.id = 'printArea'; document.body.appendChild(el); }
  el.innerHTML = html; el.style.zoom = '';
  // A4 한 장(인쇄 영역 약 188×272mm)을 조금 넘으면 자동으로 줄여서 한 장에 맞춤 (70%까지, 더 많으면 여러 쪽)
  el.style.cssText = 'display:block;position:absolute;left:-10000px;top:0;width:188mm';
  const mm = el.getBoundingClientRect().height * 25.4 / 96;
  window.__printMM = mm;
  el.style.cssText = '';
  if (mm > 268 && mm < 268 / 0.7) el.style.zoom = String(Math.floor((268 / mm) * 100) / 100);
  setTimeout(() => window.print(), 60);
}
window.addEventListener('afterprint', () => { const el = $('#printArea'); if (el) el.innerHTML = ''; });

async function planExcel(type, from, to, list, opt) {
  await loadLib('XLSX');
  const info = planInfo(type, from, to);
  const head = ['날짜', '요일', '시간', type === 'week' ? '업무 내용' : '행사 내용', '장소', '담당부서', '담당자', '구분'];
  const aoa = [[info.title], [`기간: ${info.period}`, '', '', '', '', `작성: ${dept(ME.dept).name} ${ME.name} (${todayStr()})`], [], head];
  planDays(type, from, to, list, opt.allDays).forEach((ds) => {
    const d = parseYmd(ds); const evs = list.filter((e) => e.date === ds); const md = `${d.getMonth() + 1}.${d.getDate()}`;
    if (!evs.length) aoa.push([md, DOW[d.getDay()], '', '', '', '', '', '']);
    evs.forEach((e) => aoa.push([md, DOW[d.getDay()], evTime(e), (e.important ? '★ ' : '') + e.title, e.place || '', dept(e.dept).name, e.manager || user(e.owner).name, e.kind]));
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 7 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 4 } }, { s: { r: 1, c: 5 }, e: { r: 1, c: 7 } }];
  ws['!cols'] = [{ wch: 7 }, { wch: 5 }, { wch: 13 }, { wch: 38 }, { wch: 16 }, { wch: 13 }, { wch: 10 }, { wch: 9 }];
  ws['!rows'] = [{ hpt: 28 }];
  ws['!autofilter'] = { ref: `A4:H${aoa.length}` };
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, type === 'week' ? '주중업무계획' : '월중행사계획');
  if (type === 'month') {
    const first = parseYmd(from); const start = addDays(first, -first.getDay());
    const cal = [[info.title], [], DOW.slice()];
    for (let w = 0; w < 6; w++) {
      const row = [];
      for (let i = 0; i < 7; i++) {
        const d = addDays(start, w * 7 + i);
        if (d.getMonth() !== first.getMonth()) { row.push(''); continue; }
        const evs = list.filter((e) => e.date === ymd(d));
        row.push([String(d.getDate()), ...evs.map((e) => `${e.start ? e.start + ' ' : ''}${e.title}`)].join('\n'));
      }
      if (w > 0 && row.every((x) => !x)) break;
      cal.push(row);
    }
    const cs = XLSX.utils.aoa_to_sheet(cal);
    cs['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 6 } }];
    cs['!cols'] = DOW.map(() => ({ wch: 20 }));
    cs['!rows'] = [{ hpt: 28 }, {}, {}, ...Array(6).fill({ hpt: 90 })];
    XLSX.utils.book_append_sheet(wb, cs, '달력');
  }
  XLSX.writeFile(wb, `${SCHOOL}_${info.title.replace(/\s+/g, '_')}.xlsx`);
  log('download', 'plan', info.title);
}

/* ---------- 텍스트 추출 (검색·미리보기용) ---------- */
const TEXT_EXT = ['txt', 'md', 'csv'];
const SHEET_EXT = ['xlsx', 'xls', 'csv'];
const IMG_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
const TYPE_GROUPS = { 한글: ['hwp', 'hwpx'], 엑셀: ['xlsx', 'xls', 'csv'], PDF: ['pdf'], 워드: ['doc', 'docx'], 파워포인트: ['ppt', 'pptx'], 이미지: IMG_EXT, 텍스트: ['txt', 'md'] };

async function extractText(blob, name) {
  const ext = extOf(name);
  try {
    if (TEXT_EXT.includes(ext)) return (await blob.text()).slice(0, 30000);
    if (SHEET_EXT.includes(ext)) {
      await loadLib('XLSX');
      const wb = XLSX.read(await blob.arrayBuffer(), { type: 'array' });
      return wb.SheetNames.map((n) => XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n').slice(0, 30000);
    }
    if (ext === 'docx') { await loadLib('mammoth'); const r = await mammoth.extractRawText({ arrayBuffer: await blob.arrayBuffer() }); return r.value.slice(0, 30000); }
    if (ext === 'hwpx') { const r = await parseHwpxDoc(blob); return r.text.slice(0, 30000); }
    if (ext === 'pptx') { const s = await parsePptx(blob); return s.map((x) => x.join('\n')).join('\n').slice(0, 30000); }
    if (ext === 'hwp') { try { const r = await parseHwpDoc(blob); return r.text.slice(0, 30000); } catch (e) { const r = await parseHwp(blob); return (r.text || '').slice(0, 30000); } }
  } catch (e) { console.warn('텍스트 추출 실패', name, e); }
  return '';
}

async function parsePptx(blob) {
  await loadLib('JSZip');
  const zip = await JSZip.loadAsync(blob);
  const slides = Object.keys(zip.files).filter((f) => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a, b) => parseInt(a.match(/(\d+)\.xml/)[1], 10) - parseInt(b.match(/(\d+)\.xml/)[1], 10));
  const out = [];
  for (const f of slides) {
    const xml = new DOMParser().parseFromString(await zip.file(f).async('string'), 'application/xml');
    out.push([...xml.getElementsByTagNameNS('*', 'p')].map((p) => [...p.getElementsByTagNameNS('*', 't')].map((t) => t.textContent).join('')).filter((s) => s.trim()));
  }
  return out;
}
/* HWP(5.0): OLE 복합문서의 PrvText(미리보기 텍스트)·PrvImage(첫 페이지 이미지) 추출 */
async function parseHwp(blob) {
  await loadLib('XLSX');
  const cfb = XLSX.CFB.read(new Uint8Array(await blob.arrayBuffer()), { type: 'array' });
  const t = XLSX.CFB.find(cfb, 'PrvText'); const im = XLSX.CFB.find(cfb, 'PrvImage');
  const text = t && t.content ? new TextDecoder('utf-16le').decode(new Uint8Array(t.content)).replace(/\u0000/g, '') : '';
  let img = null;
  if (im && im.content && im.content.length) {
    const b = new Uint8Array(im.content);
    const type = b[0] === 0x89 ? 'image/png' : b[0] === 0x47 ? 'image/gif' : b[0] === 0x42 ? 'image/bmp' : 'image/png';
    img = URL.createObjectURL(new Blob([b], { type }));
  }
  return { text, img };
}

async function createDoc(file, meta, silent) {
  const fileId = uid('f');
  await FileStore.put(fileId, file);
  const text = await extractText(file, file.name);
  const at = nowISO();
  const doc = {
    id: uid('doc'), title: meta.title || file.name.replace(/\.[^.]+$/, ''), category: meta.category || '기타', dept: meta.dept || ME.dept,
    createdBy: ME.id, createdAt: at, updatedAt: at, updatedBy: ME.id, cur: 1, sensitive: !!meta.sensitive, allowDownload: meta.allowDownload !== false,
    meetingId: meta.meetingId || '', tags: meta.tags || '', readBy: [ME.id],
    versions: [{ v: 1, fileId, name: file.name, ext: extOf(file.name), size: file.size, type: file.type, at, by: ME.id, note: meta.note || '최초 등록', text }],
  };
  DB.docs.unshift(doc);
  if (doc.meetingId) { const m = DB.meetings.find((x) => x.id === doc.meetingId); if (m && !m.docIds.includes(doc.id)) m.docIds.push(doc.id); }
  log('create', 'doc', doc.title, 'v1');
  if (!silent) notify(`새 자료가 등록되었습니다: ${doc.title}`, 'doc', '#docs/' + doc.id);
  saveDB();
  return doc;
}
async function addVersion(doc, file, note, fileIdReuse) {
  let fileId = fileIdReuse; let text = '';
  if (!fileId) { fileId = uid('f'); await FileStore.put(fileId, file); text = await extractText(file, file.name); }
  else { const src = doc.versions.find((x) => x.fileId === fileId); text = src ? src.text : ''; }
  const v = doc.versions.length + 1; const at = nowISO();
  const src = fileIdReuse ? doc.versions.find((x) => x.fileId === fileIdReuse) : null;
  doc.versions.push({ v, fileId, name: src ? src.name : file.name, ext: src ? src.ext : extOf(file.name), size: src ? src.size : file.size, type: src ? src.type : file.type, at, by: ME.id, note, text });
  doc.cur = v; doc.updatedAt = at; doc.updatedBy = ME.id; doc.readBy = [ME.id];
  log(fileIdReuse ? 'restore' : 'update', 'doc', doc.title, `v${v} ${note}`);
  notify(`「${doc.title}」 자료가 수정되었습니다. (v${v})`, 'doc', '#docs/' + doc.id);
  saveDB();
}

  const blob = await FileStore.get(ver.fileId);
  const ext = ver.ext;
  if (!blob) { box.innerHTML = `<div class="notice-box">${fileIcon(ext)}<p>원본 파일을 이 기기에서 찾을 수 없습니다.<br>(백업 복원 후 다시 시도하세요)</p></div>`; return; }
  const url = URL.createObjectURL(blob); viewerCleanup.push(url);
  try {
    if (ext === 'pdf') { box.innerHTML = `<iframe src="${url}" title="PDF 미리보기"></iframe>`; return; }
    if (IMG_EXT.includes(ext)) { box.innerHTML = `<img src="${url}" alt="${esc(doc.title)}" style="padding:16px">`; return; }
    if (SHEET_EXT.includes(ext)) return await renderSheet(box, blob, doc, ver, modal, editable);
    if (TEXT_EXT.includes(ext)) { box.innerHTML = `<pre>${esc(await blob.text())}</pre>`; return; }
    if (ext === 'docx') {
      await loadLib('mammoth');
      const r = await mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() });
      box.innerHTML = `<div class="docx">${r.value || '<p>(내용 없음)</p>'}</div>`; return;
    }
    if (ext === 'hwpx') {
      const r = await parseHwpxDoc(blob);
      box.innerHTML = `<div style="padding:10px 14px 0"><span class="tag blue">한글(HWPX) 미리보기 — 글자·표 내용 중심, 원본 서식은 내려받아 확인</span></div><div class="docx">${r.html || '<p>(텍스트 없음)</p>'}</div>`; return;
    }
    if (ext === 'pptx') {
      const slides = await parsePptx(blob);
      box.innerHTML = slides.map((s, i) => `<div class="slide"><h5>슬라이드 ${i + 1}</h5>${s.map((p, j) => j === 0 ? `<b style="font-size:17px;display:block;margin-bottom:6px">${esc(p)}</b>` : `<div>${esc(p)}</div>`).join('')}</div>`).join('') || '<div class="empty">텍스트가 없는 프레젠테이션입니다.</div>'; return;
    }
    if (ext === 'hwp') {
      try {
        const r = await parseHwpDoc(blob);
        box.innerHTML = `<div style="padding:10px 14px 0"><span class="tag blue">한글(HWP) 미리보기 — 글자·표 내용 중심, 원본 서식은 내려받아 확인</span></div><div class="docx">${r.html || '<p>(텍스트 없음)</p>'}</div>`; return;
      } catch (err) {
        const r = await parseHwp(blob);
        if (r.img) viewerCleanup.push(r.img);
        box.innerHTML = `<div style="padding:10px 14px 0"><span class="tag orange">${esc(err.message)} — 문서에 저장된 미리보기 정보만 표시합니다</span></div>
          ${r.img ? `<img src="${r.img}" alt="첫 페이지 미리보기" style="padding:16px;max-width:560px;background:#fff">` : ''}
          ${r.text ? `<pre>${esc(r.text)}</pre>` : ''}${!r.img && !r.text ? `<div class="notice-box">${fileIcon('hwp')}<p>미리보기 정보가 없습니다. 내려받아 한글 프로그램에서 열어 주세요.</p>${dlBtn(doc, ver)}</div>` : ''}`; return;
      }
    }
    box.innerHTML = `<div class="notice-box">${fileIcon(ext)}<p><b>${esc(ver.name)}</b><br>이 형식(${esc(ext.toUpperCase())})은 브라우저 미리보기를 지원하지 않습니다.<br>원본은 안전하게 보존되어 있으니 내려받아 확인하세요.<br><span style="font-size:12px">💡 PDF 또는 ${ext === 'doc' ? 'DOCX' : ext === 'ppt' ? 'PPTX' : 'PDF'} 형식으로 함께 올리면 바로 미리보기할 수 있습니다.</span></p>${dlBtn(doc, ver)}</div>`;
  } catch (e) {
    box.innerHTML = `<div class="notice-box">${fileIcon(ext)}<p>미리보기를 만들지 못했습니다.<br><span style="font-size:12px">${esc(e.message)}</span></p>${dlBtn(doc, ver)}</div>`;
  }
}

async function renderSheet(box, blob, doc, ver, modal, editable) {
  await loadLib('XLSX');
  const isCsv = ver.ext === 'csv';
  const wb = isCsv ? XLSX.read(await blob.text(), { type: 'string', raw: true }) : XLSX.read(await blob.arrayBuffer(), { type: 'array' });
  let cur = 0; const edits = {};
  const draw = () => {
    const name = wb.SheetNames[cur]; const ws = wb.Sheets[name];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }).slice(0, 400);
    const range = ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']) : { s: { r: 0, c: 0 } };
    const ncol = Math.min(40, Math.max(1, ...rows.map((r) => r.length)));
    box.innerHTML = `${wb.SheetNames.length > 1 ? `<div class="sheet-tabs">${wb.SheetNames.map((n, i) => `<button class="chip ${i === cur ? 'active' : ''}" data-si="${i}">${esc(n)}</button>`).join('')}</div>` : ''}
      ${editable ? '<div style="padding:10px 14px 0;font-size:12.5px;color:var(--text-2)">✏️ 셀을 클릭해 바로 수정할 수 있습니다. 수정 후 「수정 내용 저장」을 누르면 새 버전으로 보존됩니다.</div>' : ''}
      <div style="padding:10px"><div class="table-wrap" style="background:var(--card)"><table class="tbl sheet"><thead><tr><th></th>${Array.from({ length: ncol }, (_, c) => `<th>${XLSX.utils.encode_col(range.s.c + c)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r, ri) => `<tr><th>${range.s.r + ri + 1}</th>${Array.from({ length: ncol }, (_, c) => {
        const addr = XLSX.utils.encode_cell({ r: range.s.r + ri, c: range.s.c + c });
        const key = name + '!' + addr;
        return `<td ${editable ? 'contenteditable="true"' : ''} data-addr="${addr}">${esc(key in edits ? edits[key] : (r[c] ?? ''))}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div></div>`;
    $$('[data-si]', box).forEach((b) => b.addEventListener('click', () => { cur = +b.dataset.si; draw(); }));
    if (editable) $$('td[data-addr]', box).forEach((td) => td.addEventListener('blur', () => {
      const key = name + '!' + td.dataset.addr; const orig = ws[td.dataset.addr] ? (ws[td.dataset.addr].w ?? String(ws[td.dataset.addr].v)) : '';
      if (td.textContent !== orig) edits[key] = td.textContent; else delete edits[key];
      $('#sheetSave', modal).classList.toggle('hidden', !Object.keys(edits).length);
    }));
  };
  draw();
  $('#sheetSave', modal).onclick = async () => {
    Object.entries(edits).forEach(([key, val]) => {
      const [sn, addr] = [key.slice(0, key.lastIndexOf('!')), key.slice(key.lastIndexOf('!') + 1)];
      const num = /^-?\d+(\.\d+)?$/.test(val.trim()) ? Number(val) : val;
      XLSX.utils.sheet_add_aoa(wb.Sheets[sn], [[num]], { origin: addr });
    });
    let file;
    if (isCsv) file = new File(['﻿' + XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]])], ver.name, { type: 'text/csv' });
    else {
      const name = ver.name.replace(/\.xls$/i, '.xlsx');
      file = new File([XLSX.write(wb, { type: 'array', bookType: 'xlsx' })], name, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    }
    await addVersion(doc, file, `웹에서 셀 ${Object.keys(edits).length}개 수정`);
    closeModal(); toast('새 버전으로 저장되었습니다.'); openDocModal(doc.id);
  };
}

async function attachToMeeting(m, files) {
  const list = [...files].filter((f) => { if (f.size > FILE_LIMIT_MB * 1048576) { toast(`${f.name}: ${FILE_LIMIT_MB}MB 이하 파일만 올릴 수 있습니다.`); return false; } return true; });
  if (!list.length) return 0;
  toast(`${list.length}개 파일을 올리는 중…`);
  for (const f of list) await createDoc(f, { category: '회의자료', dept: m.dept, meetingId: m.id, sensitive: m.sensitive, tags: m.type }, true);
  m.updatedAt = nowISO(); m.updatedBy = ME.id;
  log('update', 'meeting', m.title, `첨부파일 ${list.length}개`);
  notify(`「${m.title}」 회의에 첨부파일 ${list.length}개가 등록되었습니다.`, 'meeting', '#meetings/' + m.id);
  saveDB(); updateBell();
  return list.length;
}

function allergyLegend(meals) {
  const nums = new Set();
  meals.forEach((ml) => ml && ml.items.forEach((s) => { const a = mealItem(s).a; if (a) a.split('.').forEach((x) => x && nums.add(+x)); }));
  return [...nums].sort((a, b) => a - b).map((n) => `<span class="tag" style="margin:0 4px 4px 0">${n}. ${ALLERGY[n - 1] || '?'}</span>`).join('');
}
VIEWS.meals = (v, args) => {
  const mode = ['today', 'week', 'month'].includes(args[0]) ? args[0] : 'today';

  const ts = todayStr(); const mg = canManageMeals();
  let body = ''; let title = ''; let prev; let next;
  if (mode === 'today') {
    const ds = ymd(base); const meal = DB.meals[ds];
    prev = addDays(base, -1); next = addDays(base, 1);
    title = fmtKo(base) + (ds === ts ? ' · 오늘' : '');
    body = `<div class="grid c2"><div class="card" ${mg ? `data-act="editMeal" data-date="${ds}" style="cursor:pointer"` : ''}>

        ${meal ? `<div style="font-size:19px">${mealMenuHTML(meal)}</div>` : `<div class="empty">${base.getDay() === 0 || base.getDay() === 6 ? '주말에는 급식이 없습니다.' : '등록된 식단이 없습니다.'}</div>`}
      </div>
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="card"><div class="card-head"><h3>⚠️ 알레르기 정보</h3></div>${meal ? allergyLegend([meal]) || '<div class="li-sub">해당 없음</div>' : '<div class="li-sub">-</div>'}${meal && meal.allergyText ? `<p style="font-size:13px;margin-top:8px">${esc(meal.allergyText)}</p>` : ''}</div>
        <div class="card"><div class="card-head"><h3>🌾 원산지 정보</h3></div><p style="font-size:13.5px;line-height:1.7;color:var(--text-2)">${meal && meal.origin ? esc(meal.origin).replace(/ \/ /g, '<br>') : '-'}</p></div>

      </div></div>`;
  } else if (mode === 'week') {
    const ws = mondayOf(base); prev = addDays(ws, -7); next = addDays(ws, 7);
    title = `${ws.getMonth() + 1}월 ${weekOfMonth(ws)}주차`;
    const days = [0, 1, 2, 3, 4].map((i) => addDays(ws, i));
    body = `<div class="meal-grid">${days.map((d) => { const ds = ymd(d); return `<div class="meal-day ${ds === ts ? 'today' : ''}" data-act="${mg ? 'editMeal' : 'go'}" data-date="${ds}" data-to="#meals/today/${ds}"><h4><b>${d.getDate()}</b>${DOW[d.getDay()]}요일${ds === ts ? ' · 오늘' : ''}</h4>${mealMenuHTML(DB.meals[ds])}</div>`; }).join('')}</div>
      <div class="card" style="margin-top:20px"><div class="card-head"><h3>⚠️ 이번 주 알레르기 유발 식품</h3></div>${allergyLegend(days.map((d) => DB.meals[ymd(d)])) || '<div class="li-sub">없음</div>'}</div>`;
  } else {
    const first = new Date(base.getFullYear(), base.getMonth(), 1); prev = addMonths(first, -1); next = addMonths(first, 1);

      <h2>${title}</h2></div>
    ${body}
    <p style="font-size:12px;color:var(--text-3);margin-top:14px">알레르기 번호: ${ALLERGY.map((a, i) => `${i + 1}.${a}`).join(' ')}</p>`;

/* ---------- 식단표 해석: 엑셀·한글(HWP/HWPX) · 목록형/달력형 자동 인식 ---------- */
const MEAL_SKIP = /^(조식|중식|석식|간식|점심|아침|저녁|메뉴|식단|급식|식단표|날짜|요일)$|원산지|알레르기|알러지|영양|단백질|탄수화물|지방|칼슘|철분|비타민|^[\d.,\s]+$|^[-–·*※~]+$/i;

function normMealItem(s) {
  s = s.replace(/[★☆◆◇●○■□▶※*#♥♡]/g, '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  let m = /^(.*?)\s*\(\s*((?:\d{1,2}\s*[.,]\s*)*\d{1,2})\s*\.?\s*\)\s*$/.exec(s);   // 된장국(5.6.13)

    return a.length ? `${m[1].trim()}(${a.join('.')})` : m[1].trim();

}

}
function detectYM(strs) {

  for (const s of strs) { const m = /(20\d{2})\s*[년.\-/]\s*(\d{1,2})\s*월?/.exec(s || ''); if (m && +m[2] >= 1 && +m[2] <= 12) return { y: +m[1], m: +m[2] }; }
  for (const s of strs) { const m = /(\d{1,2})\s*월/.exec(s || ''); if (m && +m[1] >= 1 && +m[1] <= 12) return { y: null, m: +m[1] }; }

/* 목록형: 머리글에 날짜 + 식단(메뉴) 열 */
function parseMealList(grid, raw, ym) {
  const h = grid.slice(0, 15).findIndex((r) => r.some((c) => /날짜|일자/.test(String(c))) && r.some((c) => /식단|메뉴|중식|음식/.test(String(c))));
  if (h < 0) return null;
  const head = grid[h].map((c) => String(c).replace(/\s/g, ''));
  const col = (re) => head.findIndex((c) => re.test(c));
  const C = { date: col(/날짜|일자/), menu: col(/식단|메뉴|중식|음식/), kcal: col(/칼로리|열량|kcal/i), origin: col(/원산지/), allergy: col(/알레르기|알러지/), note: col(/비고|공지/) };
  const rows = [];
  for (let i = h + 1; i < grid.length; i++) {
    const r = grid[i]; const rr = (raw && raw[i]) || [];
    let date = cellToDate(rr[C.date], r[C.date], ym.y);
    if (!date) { const m = DATE_HEAD.exec(String(r[C.date] || '').split('\n')[0]); if (m) date = mkYmd(+m[1] || ym.y, +m[2] || ym.m, +m[3]); }

    rows.push({ date, items: parsed.items, kcal: (C.kcal >= 0 ? String(r[C.kcal]).replace(/[^\d.]/g, '') : '') || parsed.kcal, origin: C.origin >= 0 ? String(r[C.origin] || '') : '', allergyText: C.allergy >= 0 ? String(r[C.allergy] || '') : '', note: C.note >= 0 ? String(r[C.note] || '') : '' });

/* 달력형: 칸의 첫 줄이 날짜, 아래 줄(또는 아래 칸)이 메뉴 */
function parseMealCalendar(grid, ym) {
  const found = [];
  const head = (t) => DATE_HEAD.exec(String(t || '').replace(/\r/g, '').split('\n')[0]);
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[r].length; c++) {
      const m = head(grid[r][c]); if (!m) continue;
      let menu = String(grid[r][c]).replace(/\r/g, '').split('\n').slice(1).join('\n');
      if (!splitMealLines(menu).items.length) {
        const parts = [];
        for (let rr = r + 1; rr < Math.min(grid.length, r + 12); rr++) { const t = grid[rr][c]; if (head(t)) break; if (t) parts.push(t); }
        menu = parts.join('\n');

      const p = splitMealLines(menu);
      if (p.items.length) found.push({ r, y: m[1] ? +m[1] : null, mo: m[2] ? +m[2] : null, d: +m[3], ...p });
    }

  const dateRows = {}; found.forEach((e) => { dateRows[e.r] = (dateRows[e.r] || 0) + 1; });
  const weekdayHead = grid.some((row) => row.filter((c) => /^\s*[(\[]?[월화수목금][)\]]?(요일)?\s*$/.test(String(c))).length >= 3);
  if (!weekdayHead && !Object.values(dateRows).some((n) => n >= 2)) return null;

    grid: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }).map((r) => r.map((x) => String(x).replace(/\r/g, ''))),
    raw: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }),
  }));

function parseMealSource(src, ym) {
  for (const g of src.grids) { const r = parseMealList(g.grid, g.raw, ym); if (r) return { kind: '목록형', rows: r }; }

  return null;
}

  return s;
}
function snippet(text, toks) {
  if (!text) return '';
  const low = text.toLowerCase(); let i = -1;
  for (const t of toks) { i = low.indexOf(t.toLowerCase()); if (i >= 0) break; }
  if (i < 0) return '';
  const s = Math.max(0, i - 40); return (s > 0 ? '…' : '') + text.slice(s, i + 80).replace(/\s+/g, ' ') + '…';
}

ACT.toggleUser = async (d) => {
  const u = user(d.id);
  if (isOwner(u)) return toast('대표 관리자 계정은 비활성화할 수 없습니다.');
  const off = u.status === 'active';
  if (off && !(await confirmBox(`${esc(u.name)} 선생님 계정을 비활성화할까요? 즉시 로그인이 차단됩니다.`, '비활성화', true))) return;

};
ACT.resetPw = (d) => {
  const u = user(d.id);
  const tmp = 'mh' + Math.floor(100000 + Math.random() * 900000);

    title: `비밀번호 초기화 · ${esc(u.name)}`,

    try { await Remote.rpc('admin_set_password', { target: u.id, new_password: pw }); } catch (e) { return toast(korErr(e)); }

  });
};

ACT.addDept = () => { const colors = ['#ff9f0a', '#64d2ff', '#bf5af2', '#ff375f', '#30d158', '#5e5ce6']; DB.depts.push({ id: uid('d'), name: '새 부서', color: colors[DB.depts.length % colors.length] }); log('create', 'dept', '새 부서'); saveDB(); rerender(); };
ACT.delDept = async (d) => {

  DB.depts = DB.depts.filter((x) => x.id !== d.id); log('delete', 'dept', dp.name); saveDB(); rerender();
};

    ${rows.map((r) => `<tr><td>${r[0]}</td>${r.slice(1).map((c) => `<td style="text-align:center;color:${c === '✓' ? 'var(--green)' : 'var(--text-2)'};font-weight:600">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p style="font-size:13px;color:var(--text-2);margin-top:12px">문서별 세부 권한: 자료마다 다운로드 제한을 설정할 수 있습니다. (학생 개인정보가 담긴 민감자료는 올리지 않습니다) 교직원별 권한 단계는 「교직원 관리」에서 변경합니다.</p></div>`;

ADMIN.history = (el) => {
  const vers = []; DB.docs.forEach((d) => d.versions.forEach((x) => vers.push({ d, x })));
  vers.sort((a, b) => b.x.at.localeCompare(a.x.at));
  const edits = DB.logs.filter((l) => ['create', 'update', 'delete', 'restore', 'import'].includes(l.act)).slice(0, 150);
  el.innerHTML = `<div class="grid c2"><div class="card"><div class="card-head"><h3>문서 버전 이력</h3></div><div class="list">${vers.slice(0, 60).map(({ d, x }) => `<div class="li" data-act="openDoc" data-id="${d.id}">${fileIcon(x.ext)}<div class="li-main"><div class="li-title">${esc(d.title)} <span class="tag blue">v${x.v}</span></div><div class="li-sub">${esc(x.note)} · ${esc(user(x.by).name)} · ${fmtFull(x.at)}</div></div></div>`).join('')}</div></div>
    <div class="card"><div class="card-head"><h3>등록·수정·삭제 기록</h3></div>${edits.map(logLine).join('') || '<div class="empty">기록 없음</div>'}</div></div>`;
};
let logFilter = '';
ADMIN.logs = (el) => {
  const acts = [...new Set(DB.logs.map((l) => l.act))];
  const list = DB.logs.filter((l) => !logFilter || l.act === logFilter).slice(0, 300);
  el.innerHTML = `<div class="card"><div class="card-head"><h3>접속·활동 로그</h3><select class="input" id="logF" style="width:auto;padding:6px 10px;font-size:13px"><option value="">전체</option>${acts.map((a) => `<option value="${a}" ${a === logFilter ? 'selected' : ''}>${ACT_LABEL[a] || a}</option>`).join('')}</select></div>

  $('#logF', el).addEventListener('change', (e) => { logFilter = e.target.value; rerender(); });
};
ADMIN.trash = (el) => {
  el.innerHTML = `<div class="card"><div class="card-head"><h3>휴지통 — 삭제 자료 복구</h3></div><div class="list">${DB.trash.map((t) => `<div class="li" style="cursor:default"><span class="tag">${TYPE_LABEL[t.type] || t.type}</span><div class="li-main"><div class="li-title">${esc(t.item.title || t.item.name || '')}</div><div class="li-sub">${esc(user(t.by).name)} 삭제 · ${fmtFull(t.at)}</div></div>
    <button class="btn secondary sm" data-act="restoreTrash" data-id="${t.id}">${icon('history', 'width="14" height="14"')}복구</button><button class="btn danger sm" data-act="purgeTrash" data-id="${t.id}">영구 삭제</button></div>`).join('') || '<div class="empty">휴지통이 비어 있습니다.</div>'}</div></div>`;
};
ACT.restoreTrash = (d) => {
  const t = DB.trash.find((x) => x.id === d.id); if (!t) return;
  if (t.type === 'event') DB.events.push(t.item);
  else if (t.type === 'doc') DB.docs.unshift(t.item);
  else if (t.type === 'meeting') DB.meetings.push(t.item);
  else if (t.type === 'notice') DB.notices.unshift(t.item);
  else if (t.type === 'meal') DB.meals[t.item.date] = t.item.meal;
  DB.trash = DB.trash.filter((x) => x.id !== t.id); log('restore', t.type, t.item.title || ''); saveDB(); toast('복구되었습니다.'); rerender();
};
ACT.purgeTrash = async (d) => {
  const t = DB.trash.find((x) => x.id === d.id);
  if (!(await confirmBox('영구 삭제하면 되돌릴 수 없습니다. 계속할까요?', '영구 삭제', true))) return;
  if (t.type === 'doc') for (const v of t.item.versions) await FileStore.del(v.fileId);
  DB.trash = DB.trash.filter((x) => x.id !== t.id); saveDB(); rerender();
};
ADMIN.backup = (el) => {
  el.innerHTML = `<div class="grid c2"><div class="card"><div class="card-head"><h3>💾 전체 자료 백업</h3></div><p style="font-size:14px;color:var(--text-2);margin-bottom:14px">일정·회의·공지·급식·자료 데이터와 모든 첨부 원본 파일(전 버전)을 하나의 백업 파일(.json)로 내려받습니다. 정기적으로 백업해 학교 공유폴더 등 안전한 곳에 보관하세요.</p>
      <button class="btn" data-act="backupExport">${icon('download', 'width="16" height="16"')}백업 파일 내려받기</button>
      <p style="font-size:12px;color:var(--text-3);margin-top:10px">최근 백업: ${DB.settings.lastBackup ? fmtFull(DB.settings.lastBackup) : '없음'}</p></div>
    <div class="card"><div class="card-head"><h3>♻️ 백업에서 복원</h3></div><p style="font-size:14px;color:var(--text-2);margin-bottom:14px">백업 파일로 일정·회의·공지·자료·급식 데이터를 복원합니다. 현재 데이터는 백업 내용으로 대체됩니다. (교직원 계정은 그대로 유지)</p>
      <label class="btn secondary">${icon('upload', 'width="16" height="16"')}백업 파일 선택<input type="file" accept=".json" id="restoreFile" hidden></label>
</div></div>`;
  $('#restoreFile', el).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    if (!(await confirmBox('현재 데이터를 백업 내용으로 대체할까요?', '복원', true))) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data.db || !data.db.docs) throw new Error('올바른 백업 파일이 아닙니다.');
      toast('복원 중… 파일이 많으면 시간이 걸립니다.');
      for (const [id, fobj] of Object.entries(data.files || {})) {
        const bin = atob(fobj.b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        await FileStore.put(id, new Blob([arr], { type: fobj.type || '' }));
      }
      ['events', 'meetings', 'docs', 'notices', 'notis', 'logs', 'trash', 'meals', 'depts', 'meetingTypes', 'categories'].forEach((k) => { if (data.db[k]) DB[k] = data.db[k]; });
      await flushNow();
      log('restore', 'system', '백업 복원', f.name); saveDB(); toast('복원되었습니다.'); renderShell(); route();
    } catch (err) { toast('복원 실패: ' + err.message); }
  });
};
ACT.backupExport = async () => {
  toast('백업 파일을 만드는 중…');
  const files = {};
  const ids = new Set(); DB.docs.forEach((d) => d.versions.forEach((v) => ids.add(v.fileId))); DB.trash.forEach((t) => t.type === 'doc' && t.item.versions.forEach((v) => ids.add(v.fileId)));
  for (const id of ids) {
    const b = await FileStore.get(id); if (!b) continue;
    const buf = new Uint8Array(await b.arrayBuffer()); let s = ''; const CH = 0x8000;
    for (let i = 0; i < buf.length; i += CH) s += String.fromCharCode.apply(null, buf.subarray(i, i + CH));
    files[id] = { type: b.type, b64: btoa(s) };
  }
  DB.settings.lastBackup = nowISO(); log('backup', 'system', '전체 백업'); saveDB();
  const { users, ...rest } = DB;
  download(new Blob([JSON.stringify({ app: 'mh_office', version: 2, at: nowISO(), db: rest, files })], { type: 'application/json' }), `${SCHOOL}_온라인교무실_백업_${todayStr()}.json`);
  rerender();
};
ADMIN.settings = (el) => {
  const s = DB.settings;
  el.innerHTML = `<div class="grid c2"><div class="card"><div class="card-head"><h3>🔐 보안</h3></div><form id="setSec">
      <div class="field"><label>일정 시간 미사용 시 재인증 (분)</label><input class="input" type="number" min="5" max="480" name="lockMinutes" value="${s.lockMinutes}"></div>
      <button class="btn">저장</button>
      <hr style="border:none;border-top:1px solid var(--line-soft);margin:18px 0">
      <p style="font-size:13px;color:var(--text-2);margin-bottom:10px">관리자 비밀번호(관리자 탭 로그인용) 변경</p><button type="button" class="btn secondary" data-act="changeMyPw">${icon('lock', 'width="16" height="16"')}내 비밀번호 변경</button></form></div>
    <div class="card"><div class="card-head"><h3>🗂 게시판 및 메뉴 관리</h3></div><form id="setMenu">
      <div class="field"><label>자료 분류 (쉼표로 구분)</label><input class="input" name="categories" value="${esc(DB.categories.join(', '))}"></div>
      <div class="field"><label>회의 유형 (쉼표로 구분)</label><textarea class="input" name="meetingTypes">${esc(DB.meetingTypes.join(', '))}</textarea></div>
      <button class="btn">저장</button></form></div></div>`;
  $('#setSec', el).addEventListener('submit', (e) => {
    e.preventDefault(); const f = formData(e.target);
    s.lockMinutes = clamp(+f.lockMinutes || 30, 5, 480);
    log('settings', 'system', '보안 설정 변경'); saveDB(); toast('저장되었습니다.');
  });
  $('#setMenu', el).addEventListener('submit', (e) => {
    e.preventDefault(); const f = formData(e.target);
    const split = (x) => x.split(',').map((y) => y.trim()).filter(Boolean);
    if (split(f.categories).length) DB.categories = split(f.categories);
    if (split(f.meetingTypes).length) DB.meetingTypes = split(f.meetingTypes);
    log('settings', 'system', '메뉴 설정 변경'); saveDB(); toast('저장되었습니다.');
  });
};

boot();
</script>
